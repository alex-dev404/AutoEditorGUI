name: Build AutoCutStudio

on:
  push:
    branches:
      - main

jobs:

  # =========================================
  # WINDOWS BUILD
  # =========================================

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Files
        run: |
          dir

      - name: Build Windows EXE
        shell: cmd
        run: |
          pyinstaller --onefile --windowed --clean --noconfirm ^
            --icon=icon.ico ^
            --add-data "icon.ico;." ^
            --add-data "icon.png;." ^
            --name "AutoCutStudio" app.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-Windows
          path: dist/AutoCutStudio.exe



  # =========================================
  # LINUX BUILD
  # =========================================

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Packages
        run: |
          sudo apt update
          sudo apt install ffmpeg -y

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Linux Executable
        run: |
          pyinstaller --onefile --windowed --clean --noconfirm \
            --icon=icon.png \
            --add-data "icon.png:." \
            --add-data "icon.ico:." \
            --name "AutoCutStudio" app.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutStudio-Linux
          path: dist/AutoCutStudio
